# Copy to orchestrator.yaml (gitignored) and fill in the placeholders.
# Secrets never live here — see .env.example for the credential refs.
version: 1

defaults:
  concurrency:
    global: 3
    perProject: 1
  agents:
    # The flow is User → BA → PM → DEV → QA → Closed; DEVOPS sits beside DEV.
    BA: { model: sonnet, budget: { maxUsd: 1.50, maxTurns: 40, wallClockMinutes: 15 } }
    PM: { model: sonnet, budget: { maxUsd: 1.00, maxTurns: 30, wallClockMinutes: 10 } }
    DEV:
      model: opus
      budget: { maxUsd: 8.00, maxTurns: 150, wallClockMinutes: 45 }
      # A slash command in the TARGET repo whose steps DEV follows. The
      # orchestrator inlines it and keeps git/board/PR steps for itself.
      # `false` turns it off. Missing in a repo → the standard workflow.
      workflowCommand: /acts-workflow-managed
    QA: { model: sonnet, budget: { maxUsd: 3.00, maxTurns: 100, wallClockMinutes: 30 } }
    DEVOPS: { model: sonnet, budget: { maxUsd: 2.00, maxTurns: 60, wallClockMinutes: 20 } }
    # Board tools per role (default: create-work-item, reassign, comment;
    # PM adds set-fields). Uncomment to narrow one:
    # QA: { capabilities: [create-work-item, reassign] }
  pr:
    draft: true
    labels: [ai-generated]
  # Where agents run. `local` runs the CLI on this machine against the worktree;
  # `docker` runs it in a container with the worktree bind-mounted at /work.
  # See docs/docker.md — especially nodeModulesVolume for pnpm workspaces.
  exec:
    driver: local
    docker:
      image: ai-orchestrator/agent:latest
      pullPolicy: missing
      network: bridge # `none` only suits roles that never install anything
      cpus: 2
      memoryMb: 4096
      nodeModulesVolume: true # set false for a pnpm-workspace monorepo

office:
  roomsPerRow: 1 # 1 = one floor per project, stacked

projects:
  - id: ai-auto-apply
    name: AI Auto-Apply
    color: '#3b82f6'
    repo:
      path: D:\Repos\GitHub\ai-auto-apply
      remote: origin
      baseBranch: main
      worktreeRoot: D:\aow\ai-auto-apply
      githubRepo: Rafael3226/ai-auto-apply
    checks:
      install: pnpm install --frozen-lockfile --prefer-offline
      test: pnpm turbo run test
      # Optional. DEVOPS verifies with this instead of `test` when present.
      # infra: pnpm run ci:validate
      required: [test]
      timeoutMinutes: 15
    board:
      provider: trello
      boardId: '<boardId>'
      credentials: TRELLO_MAIN
      botMemberId: "<the bot account's Trello member id>"
      poll:
        intervalSeconds: 15
        reconcileEveryTicks: 40
      # Push delivery. With this on, raise intervalSeconds to ~120 and lower
      # reconcileEveryTicks to ~5: the webhook carries the latency and the
      # poller becomes the reconcile safety net. The public URL and the API
      # secret live in .env — they change per tunnel, and secrets never go here.
      webhook:
        enabled: false
        manageRegistration: true
        # true for dev tunnels: the URL dies with the process, and Trello caps
        # webhooks per token, so leaving dead ones registered eventually blocks
        # new registrations.
        deleteOnShutdown: false
      columns:
        requirements: Requirements
        refinement: Refinement
        ready: Ready for Dev
        inProgress: In Progress
        testing: Testing
        blocked: Blocked
        done: Done
      # Planning-field ids, when the provider default does not fit (Jira story
      # points vary per site). Trello stores only the dates natively.
      # fields: { storyPoints: customfield_10016, startDate: customfield_10015 }
      # cardTypes: { subtask: Subtask }   # team-managed Jira
    # Per project (and per role, via agents.<ROLE>.docker) this overlays
    # defaults.exec — only the keys you name.
    # exec: { driver: docker, docker: { memoryMb: 8192 } }
    # Each role hands the card to the next with `handTo`: the target role's
    # home column is derived from its routes below, so there is one table.
    # See docs/flow.md.
    agents:
      BA:
        enabled: true
        writeback: { onSuccess: { handTo: PM, comment: report } }
      PM:
        enabled: true
        writeback: { onSuccess: { handTo: DEV, comment: report } }
      DEV:
        enabled: true
        # A change DEV marks "not testable" skips QA (flow.untestableTo).
        writeback: { onSuccess: { handTo: QA, comment: report } }
      QA:
        enabled: true
        # QA's findings send the card back to DEV (flow.escalation below).
        writeback: { onSuccess: { move: done, comment: report, addLabel: qa-passed } }
      DEVOPS: { enabled: false }
    # First match wins after the priority sort, so a label route goes above the
    # column-only route for the same column — otherwise it would be shadowed.
    routes:
      - when: { list: Requirements }
        agent: BA
      - when: { list: Refinement }
        agent: PM
      - when: { list: Ready for Dev, label: infra }
        agent: DEVOPS
      - when: { list: Ready for Dev }
        agent: DEV
      - when: { list: Testing }
        agent: QA
    # The project default; each role may overlay individual steps above.
    writeback:
      onStart: { move: inProgress, assign: bot, comment: started }
      onSuccess: { move: done, comment: report }
      onFailure: { move: blocked, comment: report, addLabel: ai-failed }
      onBlocked: { move: blocked, comment: report, addLabel: needs-human }
    flow:
      intake: requirements # raw requirements; the office chat hands stories to PM directly
      closed: done
      humanColumn: blocked
      # Who picks up what an agent (or the chat) creates.
      newItems: { story: PM, bug: DEV, task: DEV }
      # Who takes the card when a role fails or blocks. An explicit writeback
      # move/handTo on that step wins over this.
      escalation:
        BA: { onBlocked: human }
        PM: { onBlocked: BA }
        DEV: { onFailure: human, onBlocked: PM }
        QA: { onFailure: DEV }
      maxBounces: 3 # the 4th hand-off of one card to the same role goes to a human, labelled ai-loop
      untestableTo: done
      stale:
        defaultHours: 48
        columns: { blocked: 24, testing: 24 }
        label: stale

  # ── Azure DevOps: work items on the board, pull requests in Azure Repos ──
  # A card is a work item; its column is the work item State. `whoami
  # --provider azure-devops --cred ADO_MAIN contoso` prints botMemberId, and
  # `init-board contoso/Web --provider azure-devops --cred ADO_MAIN` prints a
  # `columns:` block for the states the project already has.
  #
  # - id: web-shop
  #   name: Web Shop
  #   repo:
  #     path: D:\Repos\contoso\web-shop
  #     worktreeRoot: D:\aow\web-shop
  #     host:
  #       provider: azure-devops
  #       organization: contoso
  #       project: Web
  #       repository: web-shop
  #       credentials: ADO_MAIN # ADO_MAIN_PAT: Work Items + Code, read & write
  #   board:
  #     provider: azure-devops
  #     organization: contoso
  #     project: Web
  #     workItemTypes: [User Story, Bug]
  #     # areaPath: Web\Team A
  #     credentials: ADO_MAIN
  #     botMemberId: '<identity id from `orchestrator whoami`>'
  #     columns:
  #       ready: Ready
  #       inProgress: Active
  #       review: Resolved
  #       blocked: Blocked # a custom state; the Agile template has none
  #   agents: { DEV: { enabled: true } }
  #   routes:
  #     - when: { column: Ready, label: be }
  #       agent: DEV
  #   writeback:
  #     onStart: { move: inProgress, assign: bot, comment: started }
  #     onSuccess: { move: review, comment: report }
  #     onFailure: { move: blocked, comment: report, addLabel: ai-failed }

  # ── Jira Cloud: issues on the board, pull requests on GitHub ─────────────
  # A card is an issue; its column is the issue status, and a move runs the
  # workflow transition that reaches it. Jira labels cannot contain spaces.
  #
  # - id: api
  #   name: API
  #   repo:
  #     path: D:\Repos\acme\api
  #     worktreeRoot: D:\aow\api
  #     githubRepo: acme/api
  #   board:
  #     provider: jira
  #     site: acme # or acme.atlassian.net
  #     projectKey: API
  #     # issueTypes: [Story, Bug]
  #     # jql: component = Backend
  #     credentials: JIRA_MAIN
  #     botMemberId: '<accountId from `orchestrator whoami`>'
  #     columns:
  #       ready: Selected for Development
  #       inProgress: In Progress
  #       review: In Review
  #       blocked: Blocked
  #   agents: { DEV: { enabled: true } }
  #   routes:
  #     - when: { column: Selected for Development }
  #       agent: DEV
  #   writeback:
  #     onStart: { move: inProgress, assign: bot, comment: started }
  #     onSuccess: { move: review, comment: report }
  #     onFailure: { move: blocked, comment: report, addLabel: ai-failed }
